name: RAG Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rag-quality-gate:
    name: RAG Quality Gate
    runs-on: ubuntu-latest

    env:
      ANONYMIZED_TELEMETRY: 'False'
      EVAL_DATASET: eval/ci_golden_dataset.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Copy pre-built CI fixtures into place
        run: |
          mkdir -p vectorstore data/processed
          cp -r data/ci_fixtures/chroma_store vectorstore/chroma_store
          cp data/ci_fixtures/chunks_with_embeddings.json data/processed/chunks_with_embeddings.json

      - name: Verify ChromaDB populated
        run: python -c "from vectorstore.store import get_collection; c = get_collection(); print('Chunks in store:', c.count())"

      - name: Run RAG evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python eval/run_eval.py
