name: RAG Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rag-quality-gate:
    name: RAG Quality Gate
    runs-on: ubuntu-latest

    env:
      ANONYMIZED_TELEMETRY: 'False'
      EVAL_DATASET: eval/ci_golden_dataset.json
      CI_EVAL_MODE: retrieval_only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Copy pre-built embeddings cache into place
        run: |
          mkdir -p data/processed
          cp data/ci_fixtures/chunks_with_embeddings.json data/processed/chunks_with_embeddings.json

      - name: Populate ChromaDB from cached embeddings
        run: |
          python -c "
          import json
          from vectorstore.store import add_chunks
          with open('data/processed/chunks_with_embeddings.json') as f:
              chunks = json.load(f)
          add_chunks(chunks)
          print('Chunks in store:', len(chunks))
          "

      - name: Verify ChromaDB populated
        run: python -c "from vectorstore.store import get_collection; c = get_collection(); print('Chunks in store:', c.count())"

      - name: Run retrieval precision eval
        run: python eval/run_eval.py
